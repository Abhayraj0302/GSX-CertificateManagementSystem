# Docker Compose overlay for running Nginx reverse proxy
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d

services:
  app:
    # Expose only internally to Nginx rather than publishing port 3000 to the host
    ports: !override []
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: certify-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - certify-network
